
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

    <defs>
        <linearGradient id="warna" x1="0" y1="0"
                        x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="64" height="64"
          rx="15" fill="#0f172a"/>

    <!-- Garis tepi -->
    <rect x="3" y="3"
          width="58" height="58"
          rx="12"
          fill="none"
          stroke="url(#warna)"
          stroke-width="3"/>

    <!-- Huruf -->
    <text x="32" y="46"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="40"
          font-weight="bold"
          fill="url(#warna)">A</text>

</svg>
